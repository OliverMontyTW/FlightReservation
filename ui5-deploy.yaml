# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zomoreservation
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: SAP_MAU_200
          url: http://sapdev:443
          client: '200'
        app:
          name: ZOMORESERVATION
          description: APP DESCRIPTION
          package: ZOMO
          transport: REPLACE_WITH_TRANSPORT
        exclude:
          - /test/
